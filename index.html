/* ------------------------------------------------------------------ *
 *  callAI — PLACEHOLDER. Replace the body with your real endpoint.
 *  ctx = { system, history: [{role, content}], model, user }
 *  Must return a string (the assistant reply).
 *
 *  Example (Pollinations, no key needed — all tiers share ONE real model):
 *
 *  async function callAI(prompt, ctx) {
 *    const res = await fetch('https://text.pollinations.ai/openai', {
 *      method: 'POST',
 *      headers: { 'Content-Type': 'application/json' },
 *      body: JSON.stringify({

 *        messages: [{ role: 'system', content: ctx.system }, ...ctx.history, { role: 'user', content: prompt }]
 *      })
 *    });
 *    const data = await res.json();
 *    return data.choices[0].message.content;
 *  }
 *
 *  For Groq: call it from YOUR OWN proxy so the API key is never exposed in the browser.
 * ------------------------------------------------------------------ */
const GROQ_KEY = "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"; // <-- API anahtarı burada
const GROQ_MODEL = "openai/gpt-oss-20b";

async function callAI(prompt, ctx = {}) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
    body: JSON.stringify({
      model: GROQ_MODEL,
      stream: true,
      messages: [
        { role: 'system', content: ctx.system || '' },
        ...(ctx.history || []),
        { role: 'user', content: prompt }
      ]
    }),
    signal: ctx.signal
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch {}
    throw new Error('API hatası: ' + res.status + (detail ? ' · ' + detail : ''));
  }
  if (!res.body) throw new Error('Tarayıcı streaming yanıtını desteklemiyor.');
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', full = '';
  try {
    while (true) {
      if (ctx.signal?.aborted) throw new DOMException('İstek durduruldu', 'AbortError');
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const data = JSON.parse(payload);
          if (data.error) throw new Error(data.error.message || 'Groq API hatası');
          const piece = data.choices?.[0]?.delta?.content;
          if (piece) {
            full += piece;
            if (ctx.onChunk) ctx.onChunk(full);
          }
        } catch (e) {
          if (e instanceof SyntaxError) continue;
          throw e;
        }
      }
    }
  } finally {
    try { reader.releaseLock(); } catch {}
  }
  return full;
}

async function generateChatTitle(firstMessage, ctx = {}) {

      { ...ctx, history: [], system: 'Yalnızca kısa sohbet başlığı üret. Kullanıcının dilini koru.' }
    );
    return title.trim().replace(/^["'“”]+|["'“”]+$/g, '').replace(/\s+/g, ' ').slice(0, 70) || firstMessage.slice(0, 38);
  } catch {
    return firstMessage.length > 38 ? firstMessage.slice(0, 38) + '…' : firstMessage;

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */
function MatrixBg({ theme }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext('2d');
    const size = 16; let w, h, cols, drops;
    const chars = '01アイウエオカキクケコサシスセソタチツテト<>/{}$#%&=+'.split('');
    const light = theme === 'light';
    const resize = () => {
      w = c.width = window.innerWidth; h = c.height = window.innerHeight;
      cols = Math.ceil(w / size);
      drops = Array.from({ length: cols }, () => Math.floor(Math.random() * -40));
    };
    resize(); window.addEventListener('resize', resize);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const id = reduce ? null : setInterval(() => {
      ctx.fillStyle = light ? 'rgba(242,246,244,0.12)' : 'rgba(10,10,10,0.10)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = light ? '#00935a' : '#00ff88';
      ctx.font = size + 'px monospace';
      for (let i = 0; i < cols; i++) {
        if (drops[i] > 0) ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * size, drops[i] * size);
        if (drops[i] * size > h && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 70);
    return () => { if (id) clearInterval(id); window.removeEventListener('resize', resize); };
  }, [theme]);
  return <canvas ref={ref} className="fixed inset-0 z-0 pointer-events-none" style={{ opacity: theme === 'light' ? 0.06 : 0.12 }} />;
}

/* ------------------------------------------------------------------ *
 *  Mini markdown renderer (safe: no innerHTML)
 * ------------------------------------------------------------------ */
function renderInline(text) {
  const parts = text.split(/(`[^`]+`|\*\*[^*]+\*\*)/g);
  return parts.map((p, i) => {
    if (p.length > 2 && p.startsWith('`') && p.endsWith('`')) return <code key={i} className="font-mono text-[0.86em] px-1.5 py-0.5 rounded bg-soft text-neon border border-line">{p.slice(1, -1)}</code>;
    if (p.length > 4 && p.startsWith('**') && p.endsWith('**')) return <strong key={i} className="font-semibold text-ink">{p.slice(2, -2)}</strong>;
    return <Fragment key={i}>{p}</Fragment>;
  });
}

function TextBlock({ seg }) {
  const out = []; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(<p key={out.length} className="my-1.5 leading-relaxed whitespace-pre-line">{renderInline(para.join('\n'))}</p>); para = []; } };
  const flushList = () => {
    if (list) {
      const Tag = list.ordered ? 'ol' : 'ul';
      out.push(<Tag key={out.length} className={(list.ordered ? 'list-decimal' : 'list-disc') + ' pl-5 my-1.5 space-y-1 marker:text-neon'}>{list.items.map((it, i) => <li key={i} className="leading-relaxed">{renderInline(it)}</li>)}</Tag>);
      list = null;
    }
  };
  for (const raw of seg.split('\n')) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { flushPara(); flushList(); out.push(<div key={out.length} className="font-semibold text-neon mt-3 mb-1">{renderInline(m[2])}</div>); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushPara(); if (!list || list.ordered) { flushList(); list = { ordered: false, items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (!list || !list.ordered) { flushList(); list = { ordered: true, items: [] }; } list.items.push(m[1]); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return <>{out}</>;
}

        </button>

function Markdown({ text }) {
  const segs = text.split('```');
  return (
    <div className="text-[15px]">
      {segs.map((seg, i) => {
        if (i % 2 === 1) {
          const nl = seg.indexOf('\n');
          const lang = nl >= 0 ? seg.slice(0, nl).trim() : '';
          const code = nl >= 0 ? seg.slice(nl + 1) : seg;
          return <CodeBlock key={i} lang={lang} code={code} />;
        }
        return <TextBlock key={i} seg={seg} />;
      })}
    </div>
  );
}

/* Typewriter reveal */
function TypeText({ text, model, onDone, onTick }) {
  const [n, setN] = useState(0);
  const step = Math.max(model.step, Math.ceil(text.length / (9000 / model.tick)));
  useEffect(() => {
    const id = setInterval(() => {
      setN(v => {
        const nv = Math.min(text.length, v + step);
        if (nv >= text.length) { clearInterval(id); setTimeout(onDone, 0); }
        return nv;
      });
      onTick && onTick();
    }, model.tick);
    return () => clearInterval(id);
  }, [text]);
  return <><Markdown text={text.slice(0, n)} />{n < text.length && <span className="cursor" />}</>;
}

  const abortRef = useRef(null);
  const [toast, setToast] = useState(null);
  const [input, setInput] = useState('');
  const scrollRef = useRef(null);
  const taRef = useRef(null);

  const chat = chats.find(c => c.id === activeId) || null;
  const model = MODELS.find(m => m.id === modelId) || MODELS[2];
  const left = id => { const m = MODELS.find(x => x.id === id); return Math.max(0, m.limit - (usage.counts[id] || 0)); };

  // persistence
  useEffect(() => { if (user) save(K.user, user); }, [user]);
  useEffect(() => { save(K.chats, chats); }, [chats]);
  useEffect(() => { save(K.active, activeId); }, [activeId]);
  useEffect(() => { save(K.model, modelId); }, [modelId]);
  useEffect(() => { save(K.theme, theme); document.documentElement.setAttribute('data-theme', theme); const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = theme === 'dark' ? '#0A0A0A' : '#F2F6F4'; }, [theme]);

  // daily reset check
  useEffect(() => {
    const refresh = () => setUsage(getUsage());
    const id = setInterval(refresh, 30000);
    window.addEventListener('focus', refresh);
    return () => { clearInterval(id); window.removeEventListener('focus', refresh); };
  }, []);

  const notify = msg => { setToast(msg); clearTimeout(notify._t); notify._t = setTimeout(() => setToast(null), 2800); };
  const scrollDown = useCallback(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }, []);
  useEffect(() => { scrollDown(); }, [chat && chat.messages.length, busy, activeId]);

  // textarea autosize
  useEffect(() => { const t = taRef.current; if (t) { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; } }, [input]);

  const send = async (raw, options = {}) => {
    const text = (raw || '').trim();
    if (!text || busy || !user) return;
    if (left(model.id) <= 0 && !options.retry) { notify(`${model.name} için günlük limit doldu. Başka bir SI modeli seç.`); return; }
    const now = Date.now();
    const cid = options.chatId || (chat ? chat.id : uid());
    const currentChat = chats.find(c => c.id === cid) || chat;
    const prior = options.history || (currentChat ? currentChat.messages : []);
    const userMsg = options.skipUser ? null : { id: uid(), role: 'user', content: text, ts: now };
    const messagesBefore = options.replaceFromId
      ? prior.filter(m => m.id !== options.replaceFromId && m.role !== 'assistant' ? true : m.id !== options.replaceFromId)
      : prior;
    const initialMessages = userMsg ? [...messagesBefore, userMsg] : messagesBefore;
    if (!currentChat) {
      const nc = { id: cid, title: text.length > 38 ? text.slice(0, 38) + '…' : text, created: now, updated: now, pinned: false, folder: '', messages: initialMessages };
      setChats(p => [nc, ...p]);
      setActiveId(cid);
    } else {
      setChats(p => p.map(c => c.id === cid ? { ...c, updated: now, messages: initialMessages } : c));
      setActiveId(cid);
    }
    setInput('');
    setBusy(true);
    setTypingId(null);
    const controller = new AbortController();
    abortRef.current = controller;
    const aiId = uid();
    setStreamingId(aiId);
    setChats(p => p.map(c => c.id === cid ? { ...c, messages: [...c.messages, { id: aiId, role: 'assistant', content: '', ts: Date.now(), modelId: model.id, streaming: true }] } : c));
    const system = buildSystem(user, model);
    const history = initialMessages.slice(-12).map(x => ({ role: x.role, content: x.content }));
    let ok = true, stopped = false, reply = '';
    try {
      reply = await callAI(text, {
        system, history: options.skipUser ? history.slice(0, -1) : history.slice(0, -1),
        model, user, signal: controller.signal,
        onChunk: full => {
          setChats(p => p.map(c => c.id === cid ? { ...c, messages: c.messages.map(m => m.id === aiId ? { ...m, content: full, streaming: true } : m) } : c));
          scrollDown();
        }
      });
      if (!reply.trim()) throw new Error('Boş yanıt alındı.');
    } catch (e) {
      if (e?.name === 'AbortError' || controller.signal.aborted) {
        stopped = true;
        reply = reply || 'Yanıt durduruldu.';
      } else {
        ok = false;
        reply = (reply ? reply + '\n\n' : '') + '⚠️ ' + (e.message || 'Bağlantı kurulamadı. Groq API ayarlarını kontrol et.');
      }
    }
    setChats(p => p.map(c => c.id === cid ? { ...c, updated: Date.now(), messages: c.messages.map(m => m.id === aiId ? { ...m, content: reply, streaming: false, stopped, error: !ok } : m) } : c));
    if (ok && !stopped) {
      const u = getUsage(); u.counts[model.id] = (u.counts[model.id] || 0) + 1; save(K.usage, u); setUsage({ ...u, counts: { ...u.counts } });
    }
    if (!currentChat && !options.titleAlreadySet) {
      generateChatTitle(text, { system: 'Yalnızca kısa bir başlık üret.', signal: undefined }).then(title => {
        setChats(p => p.map(c => c.id === cid ? { ...c, title } : c));
      });
    }
    setStreamingId(null);
    setBusy(false);
    setTypingId(null);
    abortRef.current = null;
  };

  const stopGeneration = () => {
    if (abortRef.current) { abortRef.current.abort(); notify('Yanıt durduruluyor…'); }

  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); notify('Kopyalandı ✔'); }
    catch { notify('Kopyalama desteklenmiyor.'); }

  const voteMessage = (messageId, vote) => {
    setChats(p => p.map(c => c.id === activeId ? { ...c, messages: c.messages.map(m => m.id === messageId ? { ...m, vote: m.vote === vote ? null : vote } : m) } : c));
  };

  const editMessage = m => { setEditTarget(m); setEditDraft(m.content); };
  const saveEdit = () => {
    if (!editTarget || !editDraft.trim() || busy) return;
    const idx = msgs.findIndex(m => m.id === editTarget.id);
    const history = msgs.slice(0, idx);
    const cid = activeId;
    setChats(p => p.map(c => c.id === cid ? { ...c, messages: history } : c));
    const edited = editDraft.trim();
    setEditTarget(null);
    setEditDraft('');
    send(edited, { chatId: cid, history, replaceFromId: editTarget.id });
  };

  const retryMessage = m => {
    if (busy) return;
    const idx = msgs.findIndex(x => x.id === m.id);
    const prior = msgs.slice(0, idx);
    const lastUser = [...prior].reverse().find(x => x.role === 'user');
    if (!lastUser) return notify('Yeniden üretilecek kullanıcı mesajı bulunamadı.');
    setChats(p => p.map(c => c.id === activeId ? { ...c, messages: prior } : c));
    send(lastUser.content, { chatId: activeId, history: prior, skipUser: true, retry: true });
  };

  const renameChat = c => {
    const title = window.prompt('Yeni sohbet adı:', c.title);
    if (title && title.trim()) setChats(p => p.map(x => x.id === c.id ? { ...x, title: title.trim().slice(0, 70) } : x));
  };
  const togglePin = (c, e) => {
    e.stopPropagation();
    setChats(p => p.map(x => x.id === c.id ? { ...x, pinned: !x.pinned } : x));
  };
  const setFolder = (c, e) => {
    e.stopPropagation();
    const folder = window.prompt('Klasör adı (boş bırak: klasörden çıkar):', c.folder || '');
    if (folder !== null) setChats(p => p.map(x => x.id === c.id ? { ...x, folder: folder.trim().slice(0, 40) } : x));
  };

  const newChat = () => { setActivePage('chat'); setActiveId(null); setDrawer(false); setTypingId(null); setTimeout(() => taRef.current && taRef.current.focus(), 50); };
  const delChat = (id, e) => { e.stopPropagation(); setChats(p => p.filter(c => c.id !== id)); if (id === activeId) setActiveId(null); notify('Sohbet silindi'); };

  const exportChats = () => {
    if (!chats.length) return notify('Dışa aktarılacak sohbet yok.');
    const out = ['SecureInf AI — Sohbet Dışa Aktarımı', `Kullanıcı: ${user.name}`, `Tarih: ${new Date().toLocaleString('tr-TR')}`, 'Veriler yalnızca bu cihazdan dışa aktarıldı.', ''];
    [...chats].sort((a, b) => a.created - b.created).forEach(c => {
      out.push('='.repeat(60), `# ${c.title}`, `Başlangıç: ${new Date(c.created).toLocaleString('tr-TR')}`, '='.repeat(60));
      c.messages.forEach(m => {
        const who = m.role === 'user' ? user.name : ('SecureInf' + (m.modelId ? ` (${(MODELS.find(x => x.id === m.modelId) || {}).name})` : ''));
        out.push(`[${new Date(m.ts).toLocaleTimeString('tr-TR')}] ${who}:`, m.content, '');
      });
    });
    const blob = new Blob([out.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `secureinf-sohbetler-${todayKey()}.txt`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    notify('Dışa aktarıldı ✔');
  };

  const clearAll = () => {
    if (abortRef.current) abortRef.current.abort();
    Object.values(K).forEach(k => { try { localStorage.removeItem(k); } catch {} });
    setSettings(false); setChats([]); setActiveId(null); setUser(null); setModelId('standard'); setTheme('dark'); setUsage(getUsage()); setTypingId(null);
    notify('Tüm yerel veriler silindi.');
  };

  const sortedChats = [...chats]
    .filter(c => !searchChats.trim() || c.title.toLowerCase().includes(searchChats.toLowerCase()) || c.messages.some(m => m.content.toLowerCase().includes(searchChats.toLowerCase())))
    .sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned) || b.updated - a.updated);
  const keyDown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input); } };
  const allMsgs = chat ? chat.messages : [];
  const msgs = messageSearch.trim()
    ? allMsgs.filter(m => m.content.toLowerCase().includes(messageSearch.toLowerCase()))
    : allMsgs;

  return (
    <div className="relative h-full">
      <MatrixBg theme={theme} />

      {!user && <Onboarding onDone={u => setUser(u)} />}

        <div className="relative z-10 h-full flex" style={{ height: '100dvh' }}>
          {/* mobile overlay */}
          <AnimatePresence>
            {drawer && <motion.div className="fixed inset-0 z-30 bg-black/60 lg:hidden" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={() => setDrawer(false)} />}

          {/* sidebar / drawer */}
          <aside className={'fixed lg:static inset-y-0 left-0 z-40 w-[290px] max-w-[85vw] flex flex-col glass border-r border-line transition-transform duration-300 ' + (drawer ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')}>
            <div className="flex items-center gap-2.5 px-4 pt-4 pb-3">
              <Logo size={30} />
              <div className="leading-tight"><div className="font-bold tracking-tight">SecureInf <span className="text-neon">AI</span></div><div className="text-[10px] font-mono text-mute">local · secure · no trace</div></div>
              <button onClick={() => setDrawer(false)} className="ml-auto p-1.5 rounded-lg hover:bg-panel2 lg:hidden" aria-label="Kapat"><I.x size={18} /></button>
            </div>
            <div className="px-3 pb-2">
              <motion.button whileTap={{ scale: .97 }} onClick={newChat} className="w-full flex items-center justify-center gap-2 rounded-xl bg-neon text-onneon font-semibold py-2.5 text-sm glow"><I.plus size={17} /> Yeni sohbet</motion.button>

                <span>💬</span><span>Sohbetler</span>
              </button>
              <button onClick={() => { setActivePage('reviews'); setDrawer(false); }} className={'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left border ' + (activePage === 'reviews' ? 'bg-soft border-line text-neon' : 'border-transparent hover:bg-panel2 text-ink')}>
                <span>⭐</span><span>Değerlendirmeler</span>
              </button>
              <button onClick={() => { setActivePage('help'); setDrawer(false); }} className={'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left border ' + (activePage === 'help' ? 'bg-soft border-line text-neon' : 'border-transparent hover:bg-panel2 text-ink')}>
                <span>❔</span><span>Yardım</span>
              </button>
            </nav>
            {activePage === 'chat' && <>
            <div className="px-3 pt-2 pb-2 space-y-2">

            </div>
            <div className="flex-1 overflow-y-auto scroll px-2 pb-2">
              {sortedChats.length === 0 && <div className="px-3 py-6 text-center text-xs text-mute font-mono">Henüz sohbet yok.<br />İlk mesajını gönder.</div>}
              <AnimatePresence initial={false}>
                {sortedChats.map(c => (
                  <motion.div key={c.id} layout initial={{ opacity: 0, x: -10 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}
                    onClick={() => { setActiveId(c.id); setActivePage('chat'); setDrawer(false); setTypingId(null); }}
                    className={'group flex items-center gap-2 rounded-xl px-3 py-2.5 cursor-pointer text-sm mb-0.5 border ' + (c.id === activeId ? 'bg-soft border-line' : 'border-transparent hover:bg-panel2')}>
                    <span className={'w-1.5 h-1.5 rounded-full shrink-0 ' + (c.id === activeId ? 'bg-neon' : 'bg-line')} />
                    <span className="flex-1 min-w-0">
                      <span className="block truncate">{c.pinned ? '📌 ' : ''}{c.title}</span>
                      {c.folder && <span className="block text-[10px] text-neon truncate">{c.folder}</span>}
                    </span>
                    <button onClick={e => { e.stopPropagation(); renameChat(c); }} title="Yeniden adlandır" className="p-1 rounded-md text-mute hover:text-neon"><span aria-hidden="true">✎</span></button>
                    <button onClick={e => togglePin(c, e)} title={c.pinned ? 'Sabitlemeyi kaldır' : 'Sabitle'} className="p-1 rounded-md text-mute hover:text-neon">{c.pinned ? '📌' : '⌖'}</button>
                    <button onClick={e => setFolder(c, e)} title="Klasör" className="p-1 rounded-md text-mute hover:text-neon">▣</button>
                    <button onClick={e => delChat(c.id, e)} aria-label="Sohbeti sil" className="p-1 rounded-md text-mute hover:text-danger"><I.trash size={15} /></button>
                  </motion.div>
                ))}
              </AnimatePresence>
            </div>
            </>}
            <div className="border-t border-line p-3 space-y-2">
              <div className="flex items-center gap-2 text-[11px] text-mute font-mono"><I.lock size={13} className="text-neon" /> Veriler yalnızca bu cihazda</div>
              <button onClick={() => { setSettings(true); setDrawer(false); }} className="w-full flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-panel2 text-left">
                <span className="w-8 h-8 rounded-full bg-soft border border-line text-neon font-bold flex items-center justify-center">{user.name.charAt(0).toUpperCase()}</span>
                <span className="flex-1 min-w-0"><span className="block text-sm font-medium truncate">{user.name}</span><span className="block text-[11px] text-mute">{user.age} yaş · ayarlar</span></span>
                <I.gear size={18} className="text-mute" />
              </button>
            </div>
          </aside>

          {/* main */}
          <main className="flex-1 min-w-0 flex flex-col h-full">
            <header className="glass border-b border-line px-3 sm:px-4 py-2.5 flex items-center gap-2 sm:gap-3 relative z-20" style={{ paddingTop: 'max(10px, env(safe-area-inset-top))' }}>
              <button onClick={() => setDrawer(true)} className="p-2 -ml-1 rounded-lg hover:bg-panel2 lg:hidden" aria-label="Menü"><I.menu /></button>
              <div className="flex items-center gap-2">
                <Logo size={28} />
                <span className="font-bold tracking-tight">{activePage === 'chat' ? <>SecureInf <span className="text-neon">AI</span></> : activePage === 'reviews' ? 'Değerlendirmeler' : 'Yardım'}</span>
              </div>
              {activePage === 'chat' && <div className="ml-auto"><ModelPicker modelId={modelId} setModelId={setModelId} usage={usage} /></div>}
            </header>

            {activePage === 'chat' && <div className="px-3 pt-2">
              {allMsgs.length > 0 && <input className="sidebar-input max-w-3xl block mx-auto" value={messageSearch} onChange={e => setMessageSearch(e.target.value)} placeholder="Bu sohbetin mesajlarında ara..." aria-label="Bu sohbette ara" />}
            </div>}
            <div ref={scrollRef} className="flex-1 overflow-y-auto scroll">
              {activePage === 'reviews' ? (
                <section className="max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full">
                  <div className="text-[11px] font-mono tracking-[.22em] uppercase text-neon mb-2">SecureInf / Topluluk</div>
                  <h1 className="text-2xl sm:text-3xl font-bold tracking-tight mb-2">Değerlendirmeler</h1>
                  <p className="text-sm text-mute mb-6">Kullanıcı değerlendirmeleri ve puanları.</p>
                  <article className="rounded-2xl border border-line bg-panel p-5 sm:p-6">
                    <div className="flex items-start gap-4">
                      <div className="w-12 h-12 shrink-0 rounded-2xl border border-neon/40 bg-soft flex items-center justify-center text-neon text-xl font-bold">E</div>
                      <div className="min-w-0 flex-1">
                        <h2 className="font-semibold text-lg">Efsa</h2>
                        <p className="text-sm text-mute mt-1">Cinsiyet: Kız</p>
                        <div className="flex flex-wrap items-center gap-1 mt-3" aria-label="10 yıldız">
                          {Array.from({ length: 10 }, (_, i) => <span key={i} className="text-amber-400 text-xl leading-none" aria-hidden="true">★</span>)}
                          <span className="text-xs text-mute ml-2">10 yıldız</span>
                        </div>
                        <div className="mt-4 rounded-xl border border-line bg-bg/70 p-3 text-sm text-mute">Değerlendirme yok</div>
                      </div>
                    </div>
                  </article>
                </section>
              ) : activePage === 'help' ? (
                <section className="max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full">
                  <div className="text-[11px] font-mono tracking-[.22em] uppercase text-neon mb-2">SecureInf / Destek</div>
                  <h1 className="text-2xl sm:text-3xl font-bold tracking-tight mb-2">Yardım ve İletişim</h1>

                  <div className="grid gap-3 sm:grid-cols-2">
                    <a href="https://wa.me/905314357945" target="_blank" rel="noreferrer" className="group rounded-2xl border border-line bg-panel p-5 hover:border-neon transition-colors">
                      <div className="flex items-center gap-3 mb-4"><span className="w-11 h-11 flex items-center justify-center rounded-xl bg-soft text-xl">☏</span><span className="font-semibold">WhatsApp</span></div>

              ) : (msgs.length === 0 && !busy ? (
                <Terminal name={user.name} onPick={s => send(s)} />
              ) : (
                <div className="max-w-3xl mx-auto px-3 sm:px-4 py-5 space-y-5">
                  {msgs.map(m => (
                    <Message key={m.id} m={m} userName={user.name}
                      typing={m.id === typingId}
                      onDone={() => setTypingId(null)} onTick={scrollDown} onSkip={() => setTypingId(null)}
                      onEdit={editMessage} onRetry={retryMessage} onVote={voteMessage} onCopy={copyText} editBusy={busy} />
                  ))}
                  {busy && <Thinking model={model} />}
                  <div className="h-2" />
                </div>
              ))}
            </div>

            {activePage === 'chat' && <div className="glass border-t border-line px-3 sm:px-4 pt-3" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
              <div className="max-w-3xl mx-auto">
                <div className="flex items-end gap-2 rounded-2xl border border-line bg-panel focus-within:border-neon transition-colors p-1.5">
                  <button onClick={() => setSettings(true)} aria-label="Ayarlar" className="p-2.5 rounded-xl text-mute hover:text-neon hover:bg-panel2 transition-colors"><I.gear size={20} /></button>
                  <textarea ref={taRef} value={input} onChange={e => setInput(e.target.value)} onKeyDown={keyDown} rows={1}
                    placeholder={`Mesajını yaz, ${user.name}...`}
                    className="flex-1 bg-transparent outline-none resize-none py-2.5 text-[15px] placeholder:text-mute max-h-[140px]" />
                  {busy
                    ? <button onClick={stopGeneration} aria-label="Yanıtı durdur" className="p-2.5 rounded-xl border border-danger text-danger">■</button>
                    : <motion.button whileTap={{ scale: .9 }} onClick={() => send(input)} disabled={!input.trim()} aria-label="Gönder"
                      className="p-2.5 rounded-xl bg-neon text-onneon disabled:opacity-30 disabled:cursor-not-allowed transition-opacity"><I.send size={20} /></motion.button>}
                </div>
                <div className="flex items-center justify-between mt-1.5 px-1 text-[10px] font-mono text-mute">
                  <span>{model.icon} {model.name} · kalan {left(model.id)}/{model.limit}</span>
                  <span className="hidden sm:inline">Enter: gönder · Shift+Enter: yeni satır</span>
                  <span className="sm:hidden">🔒 yerel</span>
                </div>
              </div>
            </div>}
          </main>
        </div>
      )}

      {editTarget && <div className="fixed inset-0 z-[90] bg-black/70 flex items-center justify-center p-4">
        <div className="w-full max-w-lg rounded-2xl border border-line bg-panel p-4">
          <div className="font-semibold mb-3">Mesajı düzenle</div>
          <textarea value={editDraft} onChange={e => setEditDraft(e.target.value)} rows={5} className="w-full rounded-xl bg-bg border border-line p-3 outline-none focus:border-neon resize-y" />
          <div className="flex justify-end gap-2 mt-3">
            <button className="msg-action" onClick={() => { setEditTarget(null); setEditDraft(''); }}>Vazgeç</button>
            <button className="rounded-xl bg-neon text-onneon font-semibold px-4 py-2 text-sm" onClick={saveEdit}>Düzenle ve gönder</button>
          </div>
        </div>
      </div>}

      <AnimatePresence>
        {user && settings && (
          <Settings key="settings" user={user} setUser={setUser} theme={theme} setTheme={setTheme} usage={usage} chats={chats}
            onExport={exportChats} onClear={clearAll} onClose={() => setSettings(false)} notify={notify} />
        )}
      </AnimatePresence>

      <AnimatePresence>
        {toast && (
          <motion.div key={toast} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 20 }}
            className="fixed left-1/2 bottom-24 z-[120] -translate-x-1/2 max-w-[90vw] rounded-xl bg-panel border border-neon px-4 py-2.5 text-sm font-mono glow" style={{ transform: 'translateX(-50%)' }}>
            {toast}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
