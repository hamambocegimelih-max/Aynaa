 *  Framer Motion (with a graceful no-animation fallback if CDN fails)
 * ------------------------------------------------------------------ */

const MOTION_PROPS = ['initial','animate','exit','transition','whileHover','whileTap','whileFocus','variants','layout','layoutId','drag'];
const _cache = {};
const motion = FM.motion || new Proxy({}, {
  get: (_, tag) => _cache[tag] || (_cache[tag] = forwardRef((props, ref) => {
    const p = { ...props };
    MOTION_PROPS.forEach(k => delete p[k]);

});

/* ------------------------------------------------------------------ *
 *  callAI — doğrudan tarayıcıdan çalışır; Worker / proxy / API anahtarı GEREKMEZ.
 *  Uç noktalar sırayla denenir; biri hata verirse sıradakine geçilir.
 *  ctx = { system, history: [{role, content}], signal, onChunk }
 *  Dönen değer: asistan yanıtının tamamı (string). Akış sırasında onChunk(tamMetin) çağrılır.
 * ------------------------------------------------------------------ */
const API_ENDPOINTS = [
  'https://text.pollinations.ai/openai',
  'https://gen.pollinations.ai/v1/chat/completions'
];
const API_MODEL = 'openai';

function apiError(status, detail) {
  const e = new Error(status === 429
    ? 'Servis şu an çok yoğun (429). Birkaç saniye sonra tekrar dene.'
    : 'API hatası: ' + status + (detail ? ' · ' + detail : ''));
  e.status = status;
  return e;
}

async function requestOnce(url, messages, ctx) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: API_MODEL, messages, stream: true }),
    signal: ctx.signal
  });
  if (!res.ok) {
    let detail = '';
    try {
      const t = await res.text();
      try { const j = JSON.parse(t); detail = String((j.error && j.error.message) || j.error || ''); } catch { detail = t.slice(0, 120); }
    } catch {}
    throw apiError(res.status, detail);
  }
  const type = res.headers.get('content-type') || '';
  // Akış desteklenmiyorsa düz JSON yanıtı oku
  if (!type.includes('text/event-stream') || !res.body) {
    const raw = await res.text();
    let text = raw;
    try { const j = JSON.parse(raw); text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ''; } catch {}
    if (text && ctx.onChunk) ctx.onChunk(text);
    return text;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', full = '';
  try {
    while (true) {
      if (ctx.signal && ctx.signal.aborted) throw new DOMException('İstek durduruldu', 'AbortError');
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let data;
        try { data = JSON.parse(payload); } catch { continue; }
        if (data.error) throw new Error((data.error && data.error.message) || 'API hatası');
        const piece = data.choices && data.choices[0] && data.choices[0].delta && data.choices[0].delta.content;
        if (piece) {
          full += piece;
          if (ctx.onChunk) ctx.onChunk(full);
        }
      }
    }
  } finally {
    try { reader.releaseLock(); } catch {}
  }
  return full;
}

async function callAI(prompt, ctx = {}) {
  const messages = [
    { role: 'system', content: ctx.system || '' },
    ...(ctx.history || []),
    { role: 'user', content: prompt }
  ];
  let lastErr = null;
  for (const url of API_ENDPOINTS) {
    try {
      const text = await requestOnce(url, messages, ctx);
      if (text && text.trim()) return text;
      lastErr = new Error('Boş yanıt alındı.');
    } catch (e) {
      if ((e && e.name === 'AbortError') || (ctx.signal && ctx.signal.aborted)) throw e;
      lastErr = (e instanceof TypeError)
        ? new Error('Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.')
        : e;
    }
  }
  throw lastErr || new Error('Bağlantı kurulamadı.');
}

async function generateChatTitle(firstMessage, ctx = {}) {
  try {

      'Aşağıdaki kullanıcı mesajı için 3-6 kelimelik, kısa ve açıklayıcı bir sohbet başlığı üret. Tırnak, açıklama veya noktalama ekleme. Mesaj: ' + firstMessage,
      { ...ctx, history: [], system: 'Yalnızca kısa sohbet başlığı üret. Kullanıcının dilini koru.' }
    );
    return title.trim().replace(/^["'“”]+|["'“”]+$/g, '').replace(/\s+/g, ' ').slice(0, 70) || firstMessage.slice(0, 38);
  } catch {
    return firstMessage.length > 38 ? firstMessage.slice(0, 38) + '…' : firstMessage;
  }
}

function renderInline(text) {
  const parts = text.split(/(`[^`]+`|\*\*[^*]+\*\*)/g);
  return parts.map((p, i) => {
    if (p.length > 2 && p.startsWith('`') && p.endsWith('`')) return <code key={i} className="font-mono text-[0.86em] px-1.5 py-0.5 rounded-md bg-panel2 text-ink border border-line">{p.slice(1, -1)}</code>;
    if (p.length > 4 && p.startsWith('**') && p.endsWith('**')) return <strong key={i} className="font-semibold text-ink">{p.slice(2, -2)}</strong>;
    return <Fragment key={i}>{p}</Fragment>;
  });
}

function TextBlock({ seg }) {
  const out = []; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(<p key={out.length} className="my-1.5 leading-relaxed whitespace-pre-line">{renderInline(para.join('\n'))}</p>); para = []; } };
  const flushList = () => {
    if (list) {
      const Tag = list.ordered ? 'ol' : 'ul';
      out.push(<Tag key={out.length} className={(list.ordered ? 'list-decimal' : 'list-disc') + ' pl-5 my-1.5 space-y-1 marker:text-mute'}>{list.items.map((it, i) => <li key={i} className="leading-relaxed">{renderInline(it)}</li>)}</Tag>);
      list = null;
    }
  };
  for (const raw of seg.split('\n')) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { flushPara(); flushList(); out.push(<div key={out.length} className="font-display font-semibold text-ink mt-4 mb-1.5 text-[1.06em]">{renderInline(m[2])}</div>); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushPara(); if (!list || list.ordered) { flushList(); list = { ordered: false, items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (!list || !list.ordered) { flushList(); list = { ordered: true, items: [] }; } list.items.push(m[1]); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return <>{out}</>;
}

function CodeBlock({ lang, code }) {
  const [ok, setOk] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(code); setOk(true); setTimeout(() => setOk(false), 1400); } catch {}

        </button>
      </div>
      <pre className="scroll overflow-x-auto p-3 text-[13px] leading-relaxed font-mono m-0" style={{ color: '#DDE3F2' }}><code>{code.replace(/\n$/, '')}</code></pre>
    </div>

}

function Markdown({ text }) {
  const segs = text.split('```');
  return (
    <div className="text-[15px]">
      {segs.map((seg, i) => {
        if (i % 2 === 1) {
          const nl = seg.indexOf('\n');
          const lang = nl >= 0 ? seg.slice(0, nl).trim() : '';
          const code = nl >= 0 ? seg.slice(nl + 1) : seg;
          return <CodeBlock key={i} lang={lang} code={code} />;
        }
        return <TextBlock key={i} seg={seg} />;
      })}
    </div>
  );
}

/* Typewriter reveal */
function TypeText({ text, model, onDone, onTick }) {
  const [n, setN] = useState(0);
  const step = Math.max(model.step, Math.ceil(text.length / (9000 / model.tick)));
  useEffect(() => {
    const id = setInterval(() => {
      setN(v => {
        const nv = Math.min(text.length, v + step);
        if (nv >= text.length) { clearInterval(id); setTimeout(onDone, 0); }
        return nv;
      });
      onTick && onTick();
    }, model.tick);
    return () => clearInterval(id);
  }, [text]);
  return <><Markdown text={text.slice(0, n)} />{n < text.length && <span className="cursor" />}</>;
}

                  <div className="mt-1 h-1.5 rounded-full bg-line overflow-hidden"><div className="h-full bg-neon rounded-full" style={{ width: Math.min(100, used / m.limit * 100) + '%' }} /></div>
                </div>
              );
            })}
          </div>
          <p className="text-xs text-mute mt-3">Sayaçlar her gün gece yarısı sıfırlanır.</p>
        </Section>

        <Section title="Veri">
          <div className="flex flex-col sm:flex-row gap-2.5">
            <button onClick={onExport} className="flex items-center justify-center gap-2 rounded-xl border border-line hover:border-neon px-4 py-2.5 text-sm"><I.download size={17} /> Sohbetleri .txt olarak dışa aktar ({chats.length})</button>
            {!confirm
              ? <button onClick={() => setConfirm(true)} className="flex items-center justify-center gap-2 rounded-xl border border-danger text-danger hover:bg-[color:var(--soft)] px-4 py-2.5 text-sm"><I.trash size={17} /> Tüm yerel verileri sil</button>
              : <div className="flex items-center gap-2 rounded-xl border border-danger px-3 py-2 text-sm">
                  <span className="text-danger">Emin misin? Geri alınamaz.</span>
                  <button onClick={onClear} className="px-3 py-1 rounded-lg bg-danger text-white font-semibold">Sil</button>
                  <button onClick={() => setConfirm(false)} className="px-3 py-1 rounded-lg border border-line">Vazgeç</button>
                </div>}
          </div>
        </Section>

        <p className="text-center text-xs text-mute tabular-nums pt-2">SecureInf AI · Konuşmaların sende kalsın. Yerel, güvenli, iz bırakmaz.</p>
      </div>
    </motion.div>
  );
}

/* ------------------------------------------------------------------ *
 *  Message bubble
 * ------------------------------------------------------------------ */
function Message({ m, userName, typing, onDone, onTick, onSkip, onEdit, onRetry, onVote, onCopy, editBusy }) {
  const isUser = m.role === 'user';
  const model = MODELS.find(x => x.id === m.modelId) || MODELS[2];
  if (isUser) {
    return (
      <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="msg-row flex flex-col items-end gap-1">
        <div className="max-w-[86%] sm:max-w-[75%] rounded-2xl rounded-br-md px-4 py-2.5 text-[15px] leading-relaxed whitespace-pre-wrap break-words"
          style={{ background: 'var(--soft)' }}>{m.content}</div>
        <div className="msg-actions flex gap-0.5">
          <button className="msg-action" onClick={() => onCopy(m.content)}>Kopyala</button>
          <button className="msg-action" disabled={editBusy} onClick={() => onEdit(m)}>Düzenle</button>
        </div>
      </motion.div>
    );
  }
  return (
    <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="msg-row flex gap-3 items-start">
      <div className="shrink-0 w-8 h-8 rounded-full bg-panel border border-line flex items-center justify-center"><Logo size={20} /></div>
      <div className="min-w-0 max-w-[92%]">
        <div onClick={typing ? onSkip : undefined} className={'break-words ' + (m.error ? 'rounded-2xl border border-danger bg-panel px-4 py-2.5' : 'pt-1')}>
          {typing ? <TypeText text={m.content} model={model} onDone={onDone} onTick={onTick} /> : <Markdown text={m.content} />}
        </div>
        <div className="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] text-mute">
          <span>{model.icon} {model.name}</span>
          <span>· {new Date(m.ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</span>
          {typing && <span className="text-neon">· yanıt geliyor</span>}
        </div>
        {!typing && !m.error && <div className="msg-actions mt-0.5 -ml-2 flex flex-wrap gap-0.5">
          <button className="msg-action" onClick={() => onCopy(m.content)}>Kopyala</button>
          <button className="msg-action" aria-label="Beğen" onClick={() => onVote(m.id, 'up')}>{m.vote === 'up' ? '👍✓' : '👍'}</button>
          <button className="msg-action" aria-label="Beğenme" onClick={() => onVote(m.id, 'down')}>{m.vote === 'down' ? '👎✓' : '👎'}</button>
          <button className="msg-action" onClick={() => onRetry(m)}>↻ Yeniden üret</button>
        </div>}
        {m.modelId === 'pro-max' && !m.error && !typing && (
          <motion.div initial={{ opacity: 0, y: 4 }} animate={{ opacity: 1, y: 0 }} className="mt-1.5 inline-flex flex-wrap items-center gap-x-2 gap-y-0.5 rounded-lg border border-line px-2.5 py-1.5 text-[10.5px] tabular-nums text-neon bg-soft">
            {PRO_MAX_STATS.map((s, i) => <Fragment key={i}>{i > 0 && <span className="text-mute">|</span>}<span>{s}</span></Fragment>)}
          </motion.div>
        )}
      </div>
    </motion.div>
  );
}

/* ------------------------------------------------------------------ *
 *  App
 * ------------------------------------------------------------------ */
function App() {
  const [user, setUser] = useState(() => load(K.user, null));
  const [chats, setChats] = useState(() => load(K.chats, []));
  const [activeId, setActiveId] = useState(() => load(K.active, null));
  const [modelId, setModelId] = useState(() => load(K.model, 'standard'));
  const [theme, setTheme] = useState(() => load(K.theme, null) || defaultTheme());
  const [usage, setUsage] = useState(getUsage);
  const [drawer, setDrawer] = useState(false);
  const [activePage, setActivePage] = useState('chat');
  const [settings, setSettings] = useState(false);
  const [busy, setBusy] = useState(false);
  const [typingId, setTypingId] = useState(null);
  const [streamingId, setStreamingId] = useState(null);
  const [searchChats, setSearchChats] = useState('');
  const [messageSearch, setMessageSearch] = useState('');
  const [editTarget, setEditTarget] = useState(null);
  const [editDraft, setEditDraft] = useState('');
  const abortRef = useRef(null);
  const [toast, setToast] = useState(null);
  const [input, setInput] = useState('');
  const [gate, setGate] = useState(null);   // { kind: 'first'|'limit', text, options, modelId }
  const scrollRef = useRef(null);
  const taRef = useRef(null);

  const chat = chats.find(c => c.id === activeId) || null;
  const model = MODELS.find(m => m.id === modelId) || MODELS[2];
  const left = id => { const m = MODELS.find(x => x.id === id); return Math.max(0, m.limit - (usage.counts[id] || 0)); };

  // persistence
  useEffect(() => { if (user) save(K.user, user); }, [user]);
  useEffect(() => { save(K.chats, chats); }, [chats]);
  useEffect(() => { save(K.active, activeId); }, [activeId]);
  useEffect(() => { save(K.model, modelId); }, [modelId]);
  useEffect(() => { save(K.theme, theme); document.documentElement.setAttribute('data-theme', theme); const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = theme === 'dark' ? '#0E1118' : '#F3F4F8'; }, [theme]);

  // daily reset check
  useEffect(() => {
    const refresh = () => setUsage(getUsage());
    const id = setInterval(refresh, 30000);
    window.addEventListener('focus', refresh);
    return () => { clearInterval(id); window.removeEventListener('focus', refresh); };
  }, []);

  const notify = msg => { setToast(msg); clearTimeout(notify._t); notify._t = setTimeout(() => setToast(null), 2800); };
  const scrollDown = useCallback(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }, []);
  useEffect(() => { scrollDown(); }, [chat && chat.messages.length, busy, activeId]);

  // textarea autosize
  useEffect(() => { const t = taRef.current; if (t) { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; } }, [input]);

  const send = async (raw, options = {}) => {
    const text = (raw || '').trim();
    if (!text || busy || !user) return;
    const isFresh = !options.skipUser && !options.replaceFromId;   // yeni yazılan mesaj (düzenleme/yeniden üretme değil)
    if (!options.skipGate) {
      if (left(model.id) <= 0 && !options.retry) { setGate({ kind: 'limit', text, options, modelId: model.id }); return; }
      const gi = getGate();
      if (isFresh && !gi.passed && gi.sent >= 1) { setGate({ kind: 'first', text, options }); return; }   // 2. mesaj
    }
    if (isFresh) { const gi = getGate(); gi.sent += 1; save(K.gate, gi); }
    const now = Date.now();
    const cid = options.chatId || (chat ? chat.id : uid());
    const currentChat = chats.find(c => c.id === cid) || chat;
    const prior = options.history || (currentChat ? currentChat.messages : []);
    const userMsg = options.skipUser ? null : { id: uid(), role: 'user', content: text, ts: now };
    const messagesBefore = options.replaceFromId
      ? prior.filter(m => m.id !== options.replaceFromId && m.role !== 'assistant' ? true : m.id !== options.replaceFromId)
      : prior;
    const initialMessages = userMsg ? [...messagesBefore, userMsg] : messagesBefore;
    if (!currentChat) {
      const nc = { id: cid, title: text.length > 38 ? text.slice(0, 38) + '…' : text, created: now, updated: now, pinned: false, folder: '', messages: initialMessages };
      setChats(p => [nc, ...p]);
      setActiveId(cid);
    } else {
      setChats(p => p.map(c => c.id === cid ? { ...c, updated: now, messages: initialMessages } : c));
      setActiveId(cid);
    }
    setInput('');
    setBusy(true);
    setTypingId(null);
    const controller = new AbortController();
    abortRef.current = controller;
    const aiId = uid();
    setStreamingId(aiId);
    setChats(p => p.map(c => c.id === cid ? { ...c, messages: [...c.messages, { id: aiId, role: 'assistant', content: '', ts: Date.now(), modelId: model.id, streaming: true }] } : c));
    const system = buildSystem(user, model);
    const history = initialMessages.slice(-12).map(x => ({ role: x.role, content: x.content }));
    let ok = true, stopped = false, reply = '';
    try {
      reply = await callAI(text, {
        system, history: options.skipUser ? history.slice(0, -1) : history.slice(0, -1),
        model, user, signal: controller.signal,
        onChunk: full => {
          setChats(p => p.map(c => c.id === cid ? { ...c, messages: c.messages.map(m => m.id === aiId ? { ...m, content: full, streaming: true } : m) } : c));
          scrollDown();
        }
      });
      if (!reply.trim()) throw new Error('Boş yanıt alındı.');
    } catch (e) {
      if (e?.name === 'AbortError' || controller.signal.aborted) {
        stopped = true;
        reply = reply || 'Yanıt durduruldu.';
      } else {
        ok = false;
        reply = (reply ? reply + '\n\n' : '') + '⚠️ ' + (e.message || 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.');
      }
    }
    setChats(p => p.map(c => c.id === cid ? { ...c, updated: Date.now(), messages: c.messages.map(m => m.id === aiId ? { ...m, content: reply, streaming: false, stopped, error: !ok } : m) } : c));
    if (ok && !stopped) {
      const u = getUsage(); u.counts[model.id] = (u.counts[model.id] || 0) + 1; save(K.usage, u); setUsage({ ...u, counts: { ...u.counts } });
    }
    if (!currentChat && !options.titleAlreadySet) {
      generateChatTitle(text, { system: 'Yalnızca kısa bir başlık üret.', signal: undefined }).then(title => {
        setChats(p => p.map(c => c.id === cid ? { ...c, title } : c));
      });
    }
    setStreamingId(null);
    setBusy(false);
    setTypingId(null);
    abortRef.current = null;
  };

  // "Reklam Linkini Aç"a basılınca: kapıyı geç, (limit ise o modelin sayacını sıfırla) ve bekleyen mesajı gönder.
  const unlockGate = () => {
    const g = gate; if (!g) return;
    const gi = getGate(); gi.passed = true; save(K.gate, gi);
    if (g.kind === 'limit') { const u = getUsage(); u.counts[g.modelId] = 0; save(K.usage, u); setUsage({ ...u, counts: { ...u.counts } }); }
    setGate(null);
    setTimeout(() => send(g.text, { ...g.options, skipGate: true }), 0);
  };

  const stopGeneration = () => {
    if (abortRef.current) { abortRef.current.abort(); notify('Yanıt durduruluyor…'); }
  };

  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); notify('Kopyalandı ✔'); }
    catch { notify('Kopyalama desteklenmiyor.'); }
  };

  const voteMessage = (messageId, vote) => {
    setChats(p => p.map(c => c.id === activeId ? { ...c, messages: c.messages.map(m => m.id === messageId ? { ...m, vote: m.vote === vote ? null : vote } : m) } : c));
  };

  const editMessage = m => { setEditTarget(m); setEditDraft(m.content); };
  const saveEdit = () => {
    if (!editTarget || !editDraft.trim() || busy) return;
    const idx = msgs.findIndex(m => m.id === editTarget.id);
    const history = msgs.slice(0, idx);
    const cid = activeId;
    setChats(p => p.map(c => c.id === cid ? { ...c, messages: history } : c));
    const edited = editDraft.trim();
    setEditTarget(null);
    setEditDraft('');
    send(edited, { chatId: cid, history, replaceFromId: editTarget.id });
  };

  const retryMessage = m => {
    if (busy) return;
    const idx = msgs.findIndex(x => x.id === m.id);
    const prior = msgs.slice(0, idx);
    const lastUser = [...prior].reverse().find(x => x.role === 'user');
    if (!lastUser) return notify('Yeniden üretilecek kullanıcı mesajı bulunamadı.');
    setChats(p => p.map(c => c.id === activeId ? { ...c, messages: prior } : c));
    send(lastUser.content, { chatId: activeId, history: prior, skipUser: true, retry: true });
  };

  const renameChat = c => {
    const title = window.prompt('Yeni sohbet adı:', c.title);
    if (title && title.trim()) setChats(p => p.map(x => x.id === c.id ? { ...x, title: title.trim().slice(0, 70) } : x));
  };
  const togglePin = (c, e) => {
    e.stopPropagation();
    setChats(p => p.map(x => x.id === c.id ? { ...x, pinned: !x.pinned } : x));
  };
  const setFolder = (c, e) => {
    e.stopPropagation();
    const folder = window.prompt('Klasör adı (boş bırak: klasörden çıkar):', c.folder || '');
    if (folder !== null) setChats(p => p.map(x => x.id === c.id ? { ...x, folder: folder.trim().slice(0, 40) } : x));
  };

  const newChat = () => { setActivePage('chat'); setActiveId(null); setDrawer(false); setTypingId(null); setTimeout(() => taRef.current && taRef.current.focus(), 50); };
  const delChat = (id, e) => { e.stopPropagation(); setChats(p => p.filter(c => c.id !== id)); if (id === activeId) setActiveId(null); notify('Sohbet silindi'); };

  const exportChats = () => {
    if (!chats.length) return notify('Dışa aktarılacak sohbet yok.');
    const out = ['SecureInf AI — Sohbet Dışa Aktarımı', `Kullanıcı: ${user.name}`, `Tarih: ${new Date().toLocaleString('tr-TR')}`, 'Veriler yalnızca bu cihazdan dışa aktarıldı.', ''];
    [...chats].sort((a, b) => a.created - b.created).forEach(c => {
      out.push('='.repeat(60), `# ${c.title}`, `Başlangıç: ${new Date(c.created).toLocaleString('tr-TR')}`, '='.repeat(60));
      c.messages.forEach(m => {
        const who = m.role === 'user' ? user.name : ('SecureInf' + (m.modelId ? ` (${(MODELS.find(x => x.id === m.modelId) || {}).name})` : ''));
        out.push(`[${new Date(m.ts).toLocaleTimeString('tr-TR')}] ${who}:`, m.content, '');
      });
    });
    const blob = new Blob([out.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `secureinf-sohbetler-${todayKey()}.txt`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    notify('Dışa aktarıldı ✔');
  };

  const clearAll = () => {
    if (abortRef.current) abortRef.current.abort();
    Object.values(K).forEach(k => { try { localStorage.removeItem(k); } catch {} });
    setSettings(false); setChats([]); setActiveId(null); setUser(null); setModelId('standard'); setTheme(defaultTheme()); setUsage(getUsage()); setTypingId(null);
    notify('Tüm yerel veriler silindi.');
  };

  const sortedChats = [...chats]
    .filter(c => !searchChats.trim() || c.title.toLowerCase().includes(searchChats.toLowerCase()) || c.messages.some(m => m.content.toLowerCase().includes(searchChats.toLowerCase())))
    .sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned) || b.updated - a.updated);
  const keyDown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input); } };
  const allMsgs = chat ? chat.messages : [];
  const msgs = messageSearch.trim()
    ? allMsgs.filter(m => m.content.toLowerCase().includes(messageSearch.toLowerCase()))
    : allMsgs;

  return (
    <div className="relative h-full">

      {!user && <Onboarding onDone={u => setUser(u)} />}

      {user && (
        <div className="relative z-10 h-full flex" style={{ height: '100dvh' }}>
          {/* mobile overlay */}
          <AnimatePresence>
            {drawer && <motion.div className="fixed inset-0 z-30 bg-black/60 lg:hidden" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={() => setDrawer(false)} />}
          </AnimatePresence>

          {/* sidebar / drawer */}
          <aside className={'fixed lg:static inset-y-0 left-0 z-40 w-[290px] max-w-[85vw] flex flex-col glass border-r border-line transition-transform duration-300 ' + (drawer ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')}>
            <div className="flex items-center gap-2.5 px-4 pt-4 pb-3">
              <Logo size={30} />
              <div className="leading-tight"><div className="font-display font-semibold text-lg">SecureInf <span className="text-neon">AI</span></div><div className="text-[11px] text-mute">Verilerin cihazında kalır</div></div>
              <button onClick={() => setDrawer(false)} className="ml-auto p-1.5 rounded-lg hover:bg-panel2 lg:hidden" aria-label="Kapat"><I.x size={18} /></button>
            </div>
            <div className="px-3 pb-2">
              <motion.button whileTap={{ scale: .97 }} onClick={newChat} className="w-full flex items-center justify-center gap-2 rounded-xl bg-neon text-onneon font-semibold py-2.5 text-sm glow"><I.plus size={17} /> Yeni sohbet</motion.button>
            </div>
            <nav aria-label="Ana menü" className="px-3 pb-3 space-y-1">
              <button onClick={() => { setActivePage('chat'); setDrawer(false); }} className={'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left border ' + (activePage === 'chat' ? 'bg-soft border-transparent text-neon font-medium' : 'border-transparent hover:bg-panel2 text-ink')}>
                <I.chat size={18} /><span>Sohbetler</span>
              </button>
              <button onClick={() => { setActivePage('reviews'); setDrawer(false); }} className={'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left border ' + (activePage === 'reviews' ? 'bg-soft border-transparent text-neon font-medium' : 'border-transparent hover:bg-panel2 text-ink')}>
                <I.star size={18} /><span>Değerlendirmeler</span>
              </button>
              <button onClick={() => { setActivePage('help'); setDrawer(false); }} className={'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left border ' + (activePage === 'help' ? 'bg-soft border-transparent text-neon font-medium' : 'border-transparent hover:bg-panel2 text-ink')}>
                <I.help size={18} /><span>Yardım</span>
              </button>
            </nav>
            {activePage === 'chat' && <>
            <div className="px-3 pt-2 pb-2 space-y-2">
              <div className="text-xs font-medium text-mute px-1">Geçmiş</div>
              <input className="sidebar-input" value={searchChats} onChange={e => setSearchChats(e.target.value)} placeholder="Sohbetlerde ara..." aria-label="Sohbet geçmişinde ara" />
            </div>
            <div className="flex-1 overflow-y-auto scroll px-2 pb-2">
              {sortedChats.length === 0 && <div className="px-3 py-6 text-center text-xs text-mute tabular-nums">Henüz sohbet yok.<br />İlk mesajını gönder.</div>}
              <AnimatePresence initial={false}>
                {sortedChats.map(c => (
                  <motion.div key={c.id} layout initial={{ opacity: 0, x: -10 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}
                    onClick={() => { setActiveId(c.id); setActivePage('chat'); setDrawer(false); setTypingId(null); }}
                    className={'chat-item group flex items-center gap-1 rounded-xl pl-3 pr-1.5 py-2 cursor-pointer text-sm mb-0.5 border border-transparent ' + (c.id === activeId ? 'is-active bg-soft' : 'hover:bg-panel2')}>
                    <span className="flex-1 min-w-0">
                      <span className="block truncate">{c.title}</span>
                      {c.folder && <span className="block text-[11px] text-mute truncate">{c.folder}</span>}
                    </span>
                    {c.pinned && <I.pin size={13} className="chat-pinned text-neon shrink-0" />}
                    <span className="chat-actions flex items-center shrink-0">
                      <button onClick={e => { e.stopPropagation(); renameChat(c); }} title="Yeniden adlandır" aria-label="Yeniden adlandır" className="p-1.5 rounded-md text-mute hover:text-ink"><I.edit size={14} /></button>
                      <button onClick={e => togglePin(c, e)} title={c.pinned ? 'Sabitlemeyi kaldır' : 'Sabitle'} aria-label={c.pinned ? 'Sabitlemeyi kaldır' : 'Sabitle'} className={'p-1.5 rounded-md hover:text-ink ' + (c.pinned ? 'text-neon' : 'text-mute')}><I.pin size={14} /></button>
                      <button onClick={e => setFolder(c, e)} title="Klasör" aria-label="Klasör" className="p-1.5 rounded-md text-mute hover:text-ink"><I.folder size={14} /></button>
                      <button onClick={e => delChat(c.id, e)} title="Sohbeti sil" aria-label="Sohbeti sil" className="p-1.5 rounded-md text-mute hover:text-danger"><I.trash size={14} /></button>
                    </span>
                  </motion.div>
                ))}
              </AnimatePresence>
            </div>
            </>}
            <div className="border-t border-line p-3 space-y-2">
              <AdSlot />
              <div className="flex items-center gap-2 text-[11px] text-mute tabular-nums"><I.lock size={13} className="text-neon" /> Veriler yalnızca bu cihazda</div>
              <button onClick={() => { setSettings(true); setDrawer(false); }} className="w-full flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-panel2 text-left">
                <span className="w-8 h-8 rounded-full bg-soft border border-line text-neon font-bold flex items-center justify-center">{user.name.charAt(0).toUpperCase()}</span>
                <span className="flex-1 min-w-0"><span className="block text-sm font-medium truncate">{user.name}</span><span className="block text-[11px] text-mute">{user.age} yaş · ayarlar</span></span>
                <I.gear size={18} className="text-mute" />
              </button>
            </div>
          </aside>

          {/* main */}
          <main className="flex-1 min-w-0 flex flex-col h-full">
            <header className="glass border-b border-line px-3 sm:px-4 py-2.5 flex items-center gap-2 sm:gap-3 relative z-20" style={{ paddingTop: 'max(10px, env(safe-area-inset-top))' }}>
              <button onClick={() => setDrawer(true)} className="p-2 -ml-1 rounded-lg hover:bg-panel2 lg:hidden" aria-label="Menü"><I.menu /></button>
              <div className="flex items-center gap-2">
                <Logo size={28} />
                <span className="font-display font-semibold text-lg">{activePage === 'chat' ? <>SecureInf <span className="text-neon">AI</span></> : activePage === 'reviews' ? 'Değerlendirmeler' : 'Yardım'}</span>
              </div>
              {activePage === 'chat' && <div className="ml-auto"><ModelPicker modelId={modelId} setModelId={setModelId} usage={usage} /></div>}
            </header>

            {activePage === 'chat' && <div className="px-3 pt-2">
              {allMsgs.length > 0 && <input className="sidebar-input max-w-3xl block mx-auto" value={messageSearch} onChange={e => setMessageSearch(e.target.value)} placeholder="Bu sohbetin mesajlarında ara..." aria-label="Bu sohbette ara" />}
            </div>}
            <div ref={scrollRef} className="flex-1 overflow-y-auto scroll">
              {activePage === 'reviews' ? (
                <section className="max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full">
                  <h1 className="font-display text-2xl sm:text-3xl font-semibold mb-2">Değerlendirmeler</h1>
                  <p className="text-sm text-mute mb-6">Kullanıcı değerlendirmeleri ve puanları.</p>
                  <article className="rounded-2xl border border-line bg-panel p-5 sm:p-6">
                    <div className="flex items-start gap-4">
                      <div className="w-12 h-12 shrink-0 rounded-2xl border border-neon/40 bg-soft flex items-center justify-center text-neon text-xl font-bold">E</div>
                      <div className="min-w-0 flex-1">
                        <h2 className="font-semibold text-lg">Efsa</h2>
                        <p className="text-sm text-mute mt-1">Cinsiyet: Kız</p>
                        <div className="flex flex-wrap items-center gap-1 mt-3" aria-label="10 yıldız">
                          {Array.from({ length: 10 }, (_, i) => <span key={i} className="text-amber-400 text-xl leading-none" aria-hidden="true">★</span>)}
                          <span className="text-xs text-mute ml-2">10 yıldız</span>
                        </div>
                        <div className="mt-4 rounded-xl border border-line bg-bg/70 p-3 text-sm text-mute">Değerlendirme yok</div>
                      </div>
                    </div>
                  </article>
                </section>
              ) : activePage === 'help' ? (
                <section className="max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full">
                  <h1 className="font-display text-2xl sm:text-3xl font-semibold mb-2">Yardım ve İletişim</h1>
                  <p className="text-sm text-mute mb-6">Soruların veya bildirmek istediğin bir sorun için aşağıdaki iletişim kanallarını kullanabilirsin.</p>
                  <div className="grid gap-3 sm:grid-cols-2">
                    <a href="https://wa.me/905314357945" target="_blank" rel="noreferrer" className="group rounded-2xl border border-line bg-panel p-5 hover:border-neon transition-colors">
                      <div className="flex items-center gap-3 mb-4"><span className="w-11 h-11 flex items-center justify-center rounded-xl bg-soft text-xl">☏</span><span className="font-semibold">WhatsApp</span></div>
                      <div className="tabular-nums text-sm group-hover:text-neon transition-colors">531 435 79 45</div>
                      <p className="mt-2 text-xs text-mute">WhatsApp üzerinden iletişime geç</p>
                    </a>
                    <a href="mailto:melih.cigdem.tt@gmail.com" className="group rounded-2xl border border-line bg-panel p-5 hover:border-neon transition-colors">
                      <div className="flex items-center gap-3 mb-4"><span className="w-11 h-11 flex items-center justify-center rounded-xl bg-soft text-xl">✉</span><span className="font-semibold">E-posta</span></div>
                      <div className="break-all text-sm group-hover:text-neon transition-colors">melih.cigdem.tt@gmail.com</div>
                      <p className="mt-2 text-xs text-mute">E-posta gönder</p>
                    </a>
                  </div>
                </section>
              ) : (msgs.length === 0 && !busy ? (
                <Welcome name={user.name} onPick={s => send(s)} />
              ) : (
                <div className="max-w-3xl mx-auto px-3 sm:px-4 py-5 space-y-5">
                  {msgs.map(m => (
                    <Message key={m.id} m={m} userName={user.name}
                      typing={m.id === typingId}
                      onDone={() => setTypingId(null)} onTick={scrollDown} onSkip={() => setTypingId(null)}
                      onEdit={editMessage} onRetry={retryMessage} onVote={voteMessage} onCopy={copyText} editBusy={busy} />
                  ))}
                  {busy && <Thinking model={model} />}
                  <div className="h-2" />
                </div>
              ))}
            </div>

            {activePage === 'chat' && <div className="glass border-t border-line px-3 sm:px-4 pt-3" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
              <div className="max-w-3xl mx-auto">
                <div className="glow flex items-end gap-2 rounded-2xl border border-line bg-panel focus-within:border-neon transition-colors p-1.5">
                  <button onClick={() => setSettings(true)} aria-label="Ayarlar" className="p-2.5 rounded-xl text-mute hover:text-neon hover:bg-panel2 transition-colors"><I.gear size={20} /></button>
                  <textarea ref={taRef} value={input} onChange={e => setInput(e.target.value)} onKeyDown={keyDown} rows={1}
                    placeholder={`Mesajını yaz, ${user.name}...`}
                    className="flex-1 bg-transparent outline-none resize-none py-2.5 text-[15px] placeholder:text-mute max-h-[140px]" />
                  {busy
                    ? <button onClick={stopGeneration} aria-label="Yanıtı durdur" className="p-2.5 rounded-xl border border-danger text-danger">■</button>
                    : <motion.button whileTap={{ scale: .9 }} onClick={() => send(input)} disabled={!input.trim()} aria-label="Gönder"
                      className="p-2.5 rounded-xl bg-neon text-onneon disabled:opacity-30 disabled:cursor-not-allowed transition-opacity"><I.send size={20} /></motion.button>}
                </div>
                <div className="flex items-center justify-between mt-1.5 px-1 text-[10px] tabular-nums text-mute">
                  <span>{model.icon} {model.name} · kalan {left(model.id)}/{model.limit}</span>
                  <span className="hidden sm:inline">Enter: gönder · Shift+Enter: yeni satır</span>
                  <span className="sm:hidden">🔒 yerel</span>
                </div>
              </div>
            </div>}
          </main>
        </div>
      )}

      {gate && <GateModal gate={gate} model={MODELS.find(m => m.id === gate.modelId) || model} onOpen={unlockGate} onClose={() => setGate(null)} />}

      {editTarget && <div className="fixed inset-0 z-[90] bg-black/70 flex items-center justify-center p-4">
        <div className="w-full max-w-lg rounded-2xl border border-line bg-panel p-4">
          <div className="font-semibold mb-3">Mesajı düzenle</div>
          <textarea value={editDraft} onChange={e => setEditDraft(e.target.value)} rows={5} className="w-full rounded-xl bg-bg border border-line p-3 outline-none focus:border-neon resize-y" />
          <div className="flex justify-end gap-2 mt-3">
            <button className="msg-action" onClick={() => { setEditTarget(null); setEditDraft(''); }}>Vazgeç</button>
            <button className="rounded-xl bg-neon text-onneon font-semibold px-4 py-2 text-sm" onClick={saveEdit}>Düzenle ve gönder</button>
          </div>
        </div>
      </div>}

      <AnimatePresence>
        {user && settings && (
          <Settings key="settings" user={user} setUser={setUser} theme={theme} setTheme={setTheme} usage={usage} chats={chats}
            onExport={exportChats} onClear={clearAll} onClose={() => setSettings(false)} notify={notify} />
        )}
      </AnimatePresence>

      <AnimatePresence>
        {toast && (
          <motion.div key={toast} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 20 }}
            className="fixed left-1/2 bottom-24 z-[120] -translate-x-1/2 max-w-[90vw] rounded-xl bg-panel border border-line px-4 py-2.5 text-sm glow" style={{ transform: 'translateX(-50%)' }}>
            {toast}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
